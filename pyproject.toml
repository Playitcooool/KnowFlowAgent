[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowflow-agent"
version = "0.1.0"
description = "Explainable Markdown-based enterprise knowledge QA agent."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
ingestion = [
  "beautifulsoup4>=4.13",
  "markdownify>=1.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
knowflow = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
