[project]
name = "knowflow-agent"
version = "0.1.0"
description = "Explainable Markdown-based enterprise knowledge QA agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ingestion = [
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pypdf>=4.2",
  "python-docx>=1.1",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[project.scripts]
knowflow = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

